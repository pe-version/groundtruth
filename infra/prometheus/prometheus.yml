# Prometheus config for the local observability profile.
# Two scrape jobs — one per process — because API and consumer are
# separate Node runtimes and each owns its own metrics surface.

global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: groundtruth-api
    static_configs:
      - targets: ["api:8080"]
        labels: { service: groundtruth-api }

  - job_name: groundtruth-consumer
    static_configs:
      - targets: ["consumer:9091"]
        labels: { service: groundtruth-consumer }
