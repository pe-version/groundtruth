services:
  # ─── Datastore ───────────────────────────────────────────────────
  # One Postgres serves three workloads:
  #   1. pgvector chunk storage (read-heavy, CPU/memory bound)
  #   2. document_jobs queue (SELECT FOR UPDATE SKIP LOCKED, write-heavy)
  #   3. metadata (users + documents) and refresh tokens
  # All three are small enough on their own that running them on one
  # instance is the right call here. Splitting becomes worth it only
  # under heavy vector-query load that competes with queue locking.
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: groundtruth
      POSTGRES_USER: groundtruth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundtruth}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # pg_isready returns 0 only after the postmaster is accepting
      # connections, which gates dependent services until init.sql has
      # had a chance to run. Stronger signal than a port probe.
      test: ["CMD-SHELL", "pg_isready -U groundtruth -d groundtruth"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ─── Application Services ─────────────────────────────────────────
  api:
    build: ./api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      POSTGRES_DSN: postgres://groundtruth:${POSTGRES_PASSWORD:-groundtruth}@postgres:5432/groundtruth?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /tmp/uploads
    volumes:
      - uploads:/tmp/uploads

  consumer:
    build: ./consumer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://groundtruth:${POSTGRES_PASSWORD:-groundtruth}@postgres:5432/groundtruth?sslmode=disable
      UPLOAD_DIR: /tmp/uploads
    volumes:
      - uploads:/tmp/uploads

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080/api

  # ─── Observability (opt-in) ──────────────────────────────────────
  # Bring up with `docker compose --profile observability up`. Off by
  # default to keep the base stack lean — these aren't required for
  # the app to run, only for the Grafana dashboard the README links.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  pg_data:
  uploads:
  prometheus_data:
  grafana_data:
