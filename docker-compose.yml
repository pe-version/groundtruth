services:
  # ─── Databases ───────────────────────────────────────────────────
  # A single Postgres instance carries two unrelated workloads here:
  #   1. pgvector chunk storage (read-heavy, CPU/memory bound)
  #   2. document_jobs queue (replaces Kafka; small, write-heavy, locked)
  # That's deliberate — neither workload is large enough to justify two
  # clusters. Splitting becomes worth it only if vector-query load starts
  # contending with queue locking. See README § Production Readiness.
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: groundtruth
    volumes:
      - mongo_data:/data/db

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: groundtruth
      POSTGRES_USER: groundtruth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundtruth}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # pg_isready returns 0 only after the postmaster is accepting
      # connections, which gates dependent services until init.sql has
      # had a chance to run. Stronger signal than a port probe.
      test: ["CMD-SHELL", "pg_isready -U groundtruth -d groundtruth"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ─── Application Services ─────────────────────────────────────────
  api:
    build: ./api
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      MONGO_URI: mongodb://mongo:27017/groundtruth
      POSTGRES_DSN: postgres://groundtruth:${POSTGRES_PASSWORD:-groundtruth}@postgres:5432/groundtruth?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /tmp/uploads
    volumes:
      - uploads:/tmp/uploads

  consumer:
    build: ./consumer
    depends_on:
      mongo:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/groundtruth
      POSTGRES_DSN: postgres://groundtruth:${POSTGRES_PASSWORD:-groundtruth}@postgres:5432/groundtruth?sslmode=disable
      UPLOAD_DIR: /tmp/uploads
    volumes:
      - uploads:/tmp/uploads

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080/api

volumes:
  mongo_data:
  pg_data:
  uploads:
